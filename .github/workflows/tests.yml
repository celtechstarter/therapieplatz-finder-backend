# Backend-Tests (pytest) bei jedem Push und Pull Request.
# Kein Test braucht echte API-Schluessel oder Internet: Claude-API, Firecrawl
# und fremde Websites werden in den Tests durch Attrappen ersetzt.
name: Backend-Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      # Fuer die wenigen Tests, die echtes HTML in einem echten (lokalen,
      # vom Netz abgeschnittenen) Chromium auslesen.
      - name: Chromium fuer Playwright
        run: python -m playwright install --with-deps chromium
      - name: Tests ausfuehren
        run: python -m pytest -q
